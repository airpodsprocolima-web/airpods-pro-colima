<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo AirPods Pro 2</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-image: url('./fondo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:30px;
    }

    .catalogo{
      width:400px;
      background:#ebe5de;
      border-radius:25px;
      padding:30px 20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    h1{
      letter-spacing:8px;
      font-size:40px;
      color:#fff;
      margin-bottom:20px;
    }

    .linea{
      width:150px;
      height:2px;
      background:white;
      margin:0 auto 25px;
    }

    .producto-img{
      width:220px;
      margin-bottom:20px;
    }

    .titulo{
      font-size:48px;
      color:white;
      font-weight:bold;
      margin-bottom:25px;
    }

    .producto{
      background:white;
      border-radius:18px;
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
      cursor:pointer;
      transition:0.25s ease;
      position:relative;
    }

    .producto:hover{
      transform:scale(0.97);
      box-shadow:0 10px 20px rgba(0,0,0,0.18);
    }

    .izq{
      text-align:left;
    }

    .nombre{
      font-weight:bold;
      color:#444;
      font-size:18px;
    }

    .precio{
      text-align:right;
    }

    .tachado{
      text-decoration:line-through;
      color:#999;
      font-size:18px;
    }

    .nuevo{
      font-size:34px;
      font-weight:bold;
      color:#222;
    }

    .extra{
      background:white;
      border-radius:18px;
      padding:20px;
      margin-top:15px;
      font-weight:bold;
      color:#444;
    }

    .telefono{
      margin-top:20px;
      background:white;
      padding:18px;
      border-radius:50px;
      font-size:22px;
      font-weight:bold;
    }

    /* Modal */
    .modal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal-content{
      background:white;
      padding:30px;
      border-radius:20px;
      width:320px;
      text-align:center;
      animation:aparecer .2s ease;
    }

    @keyframes aparecer{
      from{
        transform:scale(0.8);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .modal h2{
      margin-bottom:20px;
      color:#333;
    }

    .botones{
      display:flex;
      gap:10px;
      justify-content:center;
    }

    button{
      border:none;
      padding:12px 20px;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      transition:.2s;
    }

    .pedido{
      background:#25D366;
      color:white;
    }

    .cancelar{
      background:#ddd;
    }

    button:hover{
      opacity:0.85;
    }
  </style>
</head>
<body>

  <div class="catalogo">
    <h1>CATÁLOGO</h1>
    <div class="linea"></div>

    <img src="airpods.png" class="producto-img">

    <div class="titulo">AirPods Pro 2</div>

    <div class="producto" onclick="abrirModal('1 unidad - $349 MXN')">
      <div class="izq">
        <div class="nombre">1 UNIDAD</div>
      </div>
      <div class="precio">
        <div class="tachado">$450</div>
        <div class="nuevo">$349</div>
      </div>
    </div>

    <div class="producto" onclick="abrirModal('Paquete de 5 - $1199 MXN')">
      <div class="izq">
        <div class="nombre">PAQUETE DE 5</div>
      </div>
      <div class="precio">
        <div class="tachado">$1500</div>
        <div class="nuevo">$1199</div>
      </div>
    </div>

    <div class="producto" onclick="abrirModal('Paquete de 10 - $1899 MXN')">
      <div class="izq">
        <div class="nombre">PAQUETE DE 10</div>
      </div>
      <div class="precio">
        <div class="tachado">$2599</div>
        <div class="nuevo">$1899</div>
      </div>
    </div>

    <div class="extra">
      ENTREGAS PERSONALES EN COLIMA
    </div>

    <div class="telefono">
      WhatsApp | +52 312 305 5578
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>¿Deseas realizar tu pedido?</h2>

      <div class="botones">
        <button class="pedido" onclick="hacerPedido()">Realizar pedido</button>
        <button class="cancelar" onclick="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    let productoSeleccionado = "";

    function abrirModal(producto){
      productoSeleccionado = producto;
      document.getElementById("modal").style.display = "flex";
    }

    function cerrarModal(){
      document.getElementById("modal").style.display = "none";
    }

    function hacerPedido(){
      let mensaje = encodeURIComponent(
        "Hola, quiero pedir: " + productoSeleccionado
      );

      window.open(
        "https://wa.me/523123055578?text=" + mensaje,
        "_blank"
      );

      cerrarModal();
    }

    window.onclick = function(e){
      const modal = document.getElementById("modal");
      if(e.target === modal){
        cerrarModal();
      }
    }
  </script>

</body>
</html>
